# Local development services for heirloom-api.
#   docker compose up -d
services:
  postgres:
    image: postgres:16
    container_name: heirloom-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: heirloom
      POSTGRES_PASSWORD: heirloom
      POSTGRES_DB: heirloom
    ports:
      - "5432:5432"
    volumes:
      - heirloom-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heirloom"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    container_name: heirloom-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  heirloom-pgdata:
